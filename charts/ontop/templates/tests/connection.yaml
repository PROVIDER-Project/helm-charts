apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test" (include "ontop.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "ontop.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 60
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: connection
      image: {{ include "ontop.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command: [wget]
      args:
        - -q
        - --spider
        - {{ printf "http://%s:%v/sparql?query=ASK%%20%%7B%%7D" (include "ontop.fullname" .) .Values.service.port | quote }}
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
