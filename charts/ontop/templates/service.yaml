apiVersion: v1
kind: Service
metadata:
  name: {{ include "ontop.fullname" . }}
  labels:
    {{- include "ontop.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ontop.selectorLabels" . | nindent 4 }}
