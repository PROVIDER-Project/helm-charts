# Publish this endpoint image before deploying; override tag/digest for your release.
image:
  repository: ghcr.io/provider-project/sparql-tiva-ontop
  tag: "0.0.1"
# Ingress remains disabled until you configure a controller, hostname and TLS.
ingress:
  hosts:
    - host: tiva.example.org
      paths:
        - path: /
          pathType: Prefix
